spring.application.name=organization-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/organization_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.docker.compose.enabled=false

# Organización base (sobreescribible por variables de entorno)
organization.id=${ORG_ID:a81476a6-7acc-4740-b254-1ce685d17762}
organization.name=${ORG_NAME:PrivData}
organization.legal-name=${ORG_LEGAL_NAME:PrivData SpA}
organization.rut=${ORG_RUT:76.543.210-K}
organization.business-type=${ORG_BUSINESS_TYPE:SpA}
organization.email=${ORG_EMAIL:contacto@privdata.cl}