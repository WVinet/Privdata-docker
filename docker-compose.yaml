services:
  postgres-auth:
    image: postgres:16
    container_name: privdata-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5436:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./auth-service/docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-organization:
    image: postgres:16
    container_name: privdata-postgres-organization
    environment:
      POSTGRES_DB: organization_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_organization_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d organization_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-arco:
    image: postgres:16
    container_name: privdata-postgres-arco
    environment:
      POSTGRES_DB: arco_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - postgres_arco_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arco_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-compliance:
    image: postgres:16
    container_name: privdata-postgres-compliance
    environment:
      POSTGRES_DB: compliance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5435:5432"
    volumes:
      - postgres_compliance_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compliance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-agencia:
    image: postgres:16
    container_name: privdata-postgres-agencia
    environment:
      POSTGRES_DB: agencia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5437:5432"
    volumes:
      - postgres_agencia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agencia_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: privdata-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  auth-service:
    build: ./auth-service
    container_name: privdata-auth-service
    restart: on-failure
    depends_on:
      postgres-auth:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      JWT_SECRET: ${JWT_SECRET:-privdata-secret-key-local}
      MAIL_USERNAME: ${MAIL_USERNAME:-test@privdata.cl}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-test}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@privdata.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123456}
      TITULAR_EMAIL: ${TITULAR_EMAIL:-titular@privdata.cl}
      TITULAR_PASSWORD: ${TITULAR_PASSWORD:-Titular123456}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: false
      MAIL_SMTP_STARTTLS: false
    ports:
      - "8080:8080"

  organization-service:
    build: ./organization-service
    container_name: privdata-organization-service
    restart: on-failure
    depends_on:
      postgres-organization:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-organization:5432/organization_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    ports:
      - "8081:8081"

  arco-service:
    build: ./arco-service
    container_name: privdata-arco-service
    restart: on-failure
    depends_on:
      - postgres-arco
      - organization-service
      - minio
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-arco:5432/arco_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      ORGANIZATION_SERVICE_URL: http://organization-service:8081
      AUTH_SERVICE_URL: http://auth-service:8080
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "8082:8082"
    volumes:
      - ./portability-files:/app/portability-files

  compliance-service:
    build: ./compliance-service
    container_name: privdata-compliance-service
    restart: on-failure
    depends_on:
      postgres-compliance:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-compliance:5432/compliance_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    ports:
      - "8083:8083"

  agencia-service:
    build: ./agenciaService
    container_name: privdata-agencia-service
    restart: on-failure
    depends_on:
      postgres-agencia:
        condition: service_healthy
      arco-service:
        condition: service_started
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-agencia:5432/agencia_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      JWT_SECRET: ${JWT_SECRET:-privdata-secret-key-local}
      MAIL_USERNAME: ${MAIL_USERNAME:-test@privdata.cl}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-test}
      SERVICES_ARCO_URL: http://arco-service:8082
    ports:
      - "8084:8084"

  bff-api:
    build: ./bff-api
    container_name: privdata-bff-api
    restart: on-failure
    depends_on:
      auth-service:
        condition: service_started
      organization-service:
        condition: service_started
      arco-service:
        condition: service_started
      compliance-service:
        condition: service_started
      agencia-service:
        condition: service_started
    environment:
      SERVER_PORT: 8085
      SERVICES_AUTH_URL: http://auth-service:8080
      SERVICES_ORGANIZATION_URL: http://organization-service:8081
      SERVICES_ARCO_URL: http://arco-service:8082
      SERVICES_COMPLIANCE_URL: http://compliance-service:8083
      SERVICES_AGENCIA_URL: http://agencia-service:8084
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8085:8085"

  api-gateway:
    build: ./api-gateway
    container_name: privdata-api-gateway
    restart: on-failure
    depends_on:
      auth-service:
        condition: service_started
      bff-api:
        condition: service_started
    environment:
      SERVER_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-privdata-secret-key-local}
      AUTH_SERVICE_URL: http://auth-service:8080
      BFF_API_URL: http://bff-api:8085
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend-Privdata
    container_name: privdata-frontend
    depends_on:
      bff-api:
        condition: service_started
    ports:
      - "5173:80"

  frontend-agencia:
    build: ./Frontend-Agencia
    container_name: privdata-frontend-agencia
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "5174:80"

  minio:
    image: minio/minio:latest
    container_name: privdata-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_auth_data:
  postgres_organization_data:
  postgres_arco_data:
  postgres_compliance_data:
  postgres_agencia_data:
  minio_data:
  
