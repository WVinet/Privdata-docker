services:
  postgres-auth:
    image: postgres:16
    container_name: privdata-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5436:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./Auth-service/docker/init:/docker-entrypoint-initdb.d

  postgres-organization:
    image: postgres:16
    container_name: privdata-postgres-organization
    environment:
      POSTGRES_DB: organization_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_organization_data:/var/lib/postgresql/data

  postgres-arco:
    image: postgres:16
    container_name: privdata-postgres-arco
    environment:
      POSTGRES_DB: arco_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - postgres_arco_data:/var/lib/postgresql/data

  postgres-compliance:
    image: postgres:16
    container_name: privdata-postgres-compliance
    environment:
      POSTGRES_DB: compliance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5435:5432"
    volumes:
      - postgres_compliance_data:/var/lib/postgresql/data

  postgres-agencia:
    image: postgres:16
    container_name: privdata-postgres-agencia
    environment:
      POSTGRES_DB: agencia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5437:5432"
    volumes:
      - postgres_agencia_data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    container_name: privdata-auth-service
    restart: on-failure
    profiles: ["app"]
    depends_on:
      - postgres-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TITULAR_EMAIL: ${TITULAR_EMAIL}
      TITULAR_PASSWORD: ${TITULAR_PASSWORD}
    ports:
      - "8080:8080"

  organization-service:
    build: ./organization-service
    container_name: privdata-organization-service
    restart: on-failure
    profiles: ["app"]
    depends_on:
      - postgres-organization
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-organization:5432/organization_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    ports:
      - "8081:8081"

  arco-service:
    build: ./arco-service
    container_name: privdata-arco-service
    restart: on-failure
    profiles: ["app"]
    depends_on:
      - postgres-arco
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-arco:5432/arco_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8082:8082"

  compliance-service:
    build: ./compliance-service
    container_name: privdata-compliance-service
    restart: on-failure
    profiles: ["app"]
    depends_on:
      - postgres-compliance
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-compliance:5432/compliance_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    ports:
      - "8083:8083"

  agencia-service:
    build: ./agenciaService
    container_name: privdata-agencia-service
    restart: on-failure
    profiles: ["app"]
    depends_on:
      - postgres-agencia
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-agencia:5432/agencia_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SERVICES_ARCO_URL: http://arco-service:8082
    ports:
      - "8084:8084"

  bff-api:
    build: ./bff-api
    container_name: privdata-bff-api
    profiles: ["app"]
    depends_on:
      - auth-service
      - organization-service
      - arco-service
      - compliance-service
      - agencia-service
    environment:
      SERVER_PORT: 8085
      SERVICES_AUTH_URL: http://auth-service:8080
      SERVICES_ORGANIZATION_URL: http://organization-service:8081
      SERVICES_ARCO_URL: http://arco-service:8082
      SERVICES_COMPLIANCE_URL: http://compliance-service:8083
      SERVICES_AGENCIA_URL: http://agencia-service:8084
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8085:8085"

  frontend:
    build: ./frontend-privdata
    container_name: privdata-frontend
    profiles: ["app"]
    ports:
      - "5173:80"
    depends_on:
      - bff-api

  mailhog:
    image: mailhog/mailhog
    container_name: privdata-mailhog
    ports:
      - "1025:1025"   # SMTP — Auth-service envía aquí
      - "8025:8025"   # Web UI — ver los emails en http://localhost:8025

volumes:
  postgres_auth_data:
  postgres_organization_data:
  postgres_arco_data:
  postgres_compliance_data:
  postgres_agencia_data: