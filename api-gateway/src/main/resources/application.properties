spring.application.name=api-gateway
server.port=8000

# JWT
spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:3d8f2b4e6a9c1f0e7b5d3a2c4f8e6b1d3a9f2e5c7b0d4a6e8f1c3b5d7a9e2f4}

# Routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=bff-api
spring.cloud.gateway.server.webflux.routes[1].uri=${BFF_API_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/**
management.endpoints.web.exposure.include=health,info,gateway

jwt.secret=${JWT_SECRET:3d8f2b4e6a9c1f0e7b5d3a2c4f8e6b1d3a9f2e5c7b0d4a6e8f1c3b5d7a9e2f4}
