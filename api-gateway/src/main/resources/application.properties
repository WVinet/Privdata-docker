spring.application.name=api-gateway
server.port=8000

# JWT
spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:privdata-secret-key-privdata-secret-key-privdata}

# Routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=organization-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://organization-service:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/organizations/**,/api/persons/**,/api/departments/**

spring.cloud.gateway.server.webflux.routes[2].id=arco-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://arco-service:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/arco/**

spring.cloud.gateway.server.webflux.routes[3].id=compliance-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://compliance-service:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/compliance/**

spring.cloud.gateway.server.webflux.routes[4].id=agencia-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://agencia-service:8084
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/agencia/**,/api/claims/**

management.endpoints.web.exposure.include=health,info,gateway

jwt.secret=${JWT_SECRET:privdata-secret-key-privdata-secret-key-privdata}
