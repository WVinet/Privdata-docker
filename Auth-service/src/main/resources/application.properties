spring.application.name=authservice

spring.datasource.url=jdbc:postgresql://localhost:5436/auth_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

application.security.jwt.secret-key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
application.security.jwt.expiration=3600000

server.port=8080

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.docker.compose.enabled=false

# Super Admin seed (sobreescribible por variables de entorno)
admin.email=${ADMIN_EMAIL:admin@privdata.cl}
admin.password=${ADMIN_PASSWORD:Admin1234!}
admin.organization-id=${ADMIN_ORG_ID:11111111-1111-1111-1111-111111111111}
admin.person-id=${ADMIN_PERSON_ID:99999999-9999-9999-9999-999999999999}